name: Deploy server

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/deploy-server.yml']
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install wrangler
        run: npm install --no-audit --no-fund

      - name: Ensure workers.dev subdomain
        run: |
          set -o pipefail
          API=https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" $API | jq -r '.result.subdomain // empty')
          if [ -z "$SUB" ]; then
            for name in anis-reader anis-reader-app anis-$RANDOM; do
              R=$(curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" -d "{\"subdomain\":\"$name\"}" $API)
              echo "$R" | jq -c '{success, errors}'
              if [ "$(echo "$R" | jq -r .success)" = "true" ]; then SUB=$name; break; fi
            done
          fi
          echo "SUBDOMAIN=$SUB" >> $GITHUB_ENV
          echo "workers.dev subdomain: $SUB"

      - name: Ensure D1 database
        run: |
          ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="anis-db") | .uuid')
          if [ -z "$ID" ]; then
            npx wrangler d1 create anis-db
            ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="anis-db") | .uuid')
          fi
          echo "D1 id: $ID"
          sed -i "s/REPLACED_IN_CI/$ID/" wrangler.toml

      - name: Apply migrations
        run: npx wrangler d1 migrations apply anis-db --remote

      - name: Deploy
        run: npx wrangler deploy 2>&1 | tee ../deploy.log

      - name: Set secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY
          printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD

      - name: Health check
        run: |
          URL="https://anis.$SUBDOMAIN.workers.dev"
          for i in 1 2 3 4 5 6; do
            if curl -sf "$URL/health"; then echo; break; fi
            sleep 10
          done
          echo "SERVER_URL=$URL" >> $GITHUB_ENV

      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          {
            echo "Status: ${{ job.status }}"
            echo "Server: ${SERVER_URL:-unknown}"
            echo "Subdomain: ${SUBDOMAIN:-none}"
            echo '```'
            tail -c 3000 deploy.log 2>/dev/null | grep -v -i "token" || true
            echo '```'
          } > report.md
          gh issue create -R ${{ github.repository }} --title "Server deploy #${{ github.run_number }}: ${{ job.status }}" --body-file report.md
