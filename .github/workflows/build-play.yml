name: Build Google Play (AAB)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name shown on Google Play (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write
  issues: write

jobs:
  play:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Restore upload key from secrets
        env:
          PW: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          KS: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -z "$PW" ] || [ -z "$KS" ]; then echo "::error::Add the GitHub secrets UPLOAD_KEYSTORE_B64 and UPLOAD_KEYSTORE_PASSWORD first"; exit 1; fi
          echo "$KS" | tr -d ' \n\r' | base64 -d > android/app/anis-upload.p12
          keytool -list -keystore android/app/anis-upload.p12 -storetype pkcs12 -storepass "$PW" | grep -i anis-upload

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Google Play channel (no external payments inside the app)
        run: echo "window.CHANNEL='play';" > www/channel.js

      - name: Install & sync
        run: |
          npm ci
          npx cap sync android

      - name: Build signed AAB
        working-directory: android
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew bundleRelease --no-daemon 2>&1 | tee ../build.log
          cp app/build/outputs/bundle/release/app-release.aab ../anis-play.aab

      - name: Show signing certificate
        run: keytool -printcert -jarfile anis-play.aab | grep -E "SHA1|SHA256|Owner" || true

      - name: Publish AAB
        uses: softprops/action-gh-release@v2
        with:
          tag_name: play-${{ github.run_number }}
          name: Google Play — ${{ inputs.version_name }} (code ${{ github.run_number }})
          body: ملف anis-play.aab للرفع على Google Play Console (Upload key). versionCode=${{ github.run_number }}
          files: anis-play.aab
          prerelease: true
          make_latest: false

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 60000 build.log > tail.log 2>/dev/null || echo "no log (check the secret step)" > tail.log
          gh issue create -R ${{ github.repository }} --title "Play build ${{ github.run_number }} failed" --body-file tail.log
