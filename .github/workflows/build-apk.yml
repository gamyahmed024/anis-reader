name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['server/**', '.github/workflows/deploy-server.yml']
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls $ANDROID_HOME/platforms

      - name: Install & sync
        run: |
          npm ci
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee ../build.log

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk anis.apk

      - uses: actions/upload-artifact@v4
        with:
          name: anis-apk
          path: anis.apk

      - name: Publish to Releases (easy download from phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: أنيس — نسخة ${{ github.run_number }}
          body: حمّل ملف anis.apk من الأسفل وثبّته على هاتفك.
          files: anis.apk
          make_latest: true

      - name: Report build failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 60000 build.log > tail.log || echo "no log" > tail.log
          gh issue create -R ${{ github.repository }} --title "Build ${{ github.run_number }} failed" --body-file tail.log
